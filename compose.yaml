#define services
services:
  neo4j-database:
    image: neo4j:2026.10.1
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
    ports:
      - "127.0.0.1:7474:7474" #http port
      - "127.0.0.1:7687:7687" #bolt port
    volumes:
      - ticket_database:/data

    #healthcheck to make sure app starts after database is ready
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]

      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build: .
    environment:
      NEO4J_URI: "bolt://neo4j-database:7687"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    depends_on:
      neo4j-database:
        condition: service_healthy

volumes:
  ticket_database:
